services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rdi-db
    environment:
      POSTGRES_DB: rdi
      POSTGRES_USER: rdi
      POSTGRES_PASSWORD: rdi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdi -d rdi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
