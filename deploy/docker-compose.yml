services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rdi-db
    environment:
      POSTGRES_DB: rdi
      POSTGRES_USER: rdi
      POSTGRES_PASSWORD: rdi
    ports:
      # 宿主 5432 常被别的项目占着（本机 trpg 的 pgvector 容器就是），
      # 所以 ganyu 映射到 5433。容器内仍是 5432。
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdi -d rdi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
